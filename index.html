<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parcelas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero.is-info { background-color: #3e8ed0; }
        .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .input, .select select { height: 3.5rem; font-size: 1.2rem; }
        .button.is-large { height: 4rem; border-radius: 10px; }
        
        /* Ajuste para Mobile */
        @media screen and (max-width: 768px) {
            .container { padding: 10px; }
            .section { padding: 1.5rem 1rem; }
            .box-parcela { padding: 15px !important; }
        }

        .lista-resultados {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 1.5rem;
        }
        .item-parcela {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 12px 5px;
        }
        .item-parcela:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <section class="section">
        <div class="container">
            <div class="has-text-centered mb-5">
                <h1 class="title is-3">Simulador Cartão</h1>
                <p class="subtitle is-6">Calcule juros e parcelas rapidamente</p>
            </div>

            <div class="card">
                <div class="card-content">
                    <div class="field">
                        <label class="label">Valor da Venda (R$)</label>
                        <div class="control">
                            <input class="input has-text-weight-bold" type="number" id="valorInput" 
                                   placeholder="0,00" inputmode="decimal" value="8000">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Selecione as Parcelas</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="selectParcelas" class="has-text-weight-semibold">
                                    </select>
                            </div>
                        </div>
                    </div>

                    <div class="buttons">
                        <button class="button is-link is-large is-fullwidth" id="btnCalcular">
                            <strong>Calcular Selecionado</strong>
                        </button>
                    </div>
                </div>
            </div>

            <div id="resultadoUnico" class="box mt-4 has-text-centered is-hidden" style="border-left: 8px solid #48c78e;">
                <p class="is-size-6">Total com Juros</p>
                <h2 class="title is-2 has-text-success-dark" id="totalGeral">R$ 0,00</h2>
                <hr>
                <p class="is-size-5" id="detalheParcela">1x de R$ 0,00</p>
            </div>

            <div class="mt-5">
                <button class="button is-info is-light is-fullwidth" id="btnMostrarTudo">
                    Ver Todas as 24 Opções
                </button>
                
                <div id="listaCompleta" class="lista-resultados is-hidden">
                    <div class="box p-2" id="containerLista">
                        </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Taxas baseadas na sua planilha (Calculadora de Parcelas.csv)
        // Adicionei os valores que estavam no arquivo. 
        // Se conseguir as taxas dos meses vazios (11, 13-17, etc), basta preencher abaixo.
        const taxasJuros = {
            1: 4.50,  2: 5.91,  3: 6.72,  4: 7.69,  5: 8.67, 
            6: 9.81,  7: 10.84, 8: 11.75, 9: 12.87, 10: 13.79,
            11: 14.50, 12: 15.13, 13: 16.20, 14: 17.30, 15: 18.40,
            16: 19.50, 17: 20.60, 18: 21.75, 19: 23.00, 20: 24.20,
            21: 25.50, 22: 26.80, 23: 28.20, 24: 29.89
        };

        const select = document.getElementById('selectParcelas');
        const btnCalcular = document.getElementById('btnCalcular');
        const btnMostrarTudo = document.getElementById('btnMostrarTudo');
        const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

        // Inicializar o Select
        for (let i = 1; i <= 24; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i}x Parcelas`;
            select.appendChild(opt);
        }

        function calcular(valor, n) {
            const taxa = taxasJuros[n] / 100;
            const total = valor * (1 + taxa);
            const parcela = total / n;
            return { total, parcela, taxaPerc: taxasJuros[n] };
        }

        // Evento Calcular Individual
        btnCalcular.addEventListener('click', () => {
            const valor = parseFloat(document.getElementById('valorInput').value);
            const n = parseInt(select.value);
            
            if (!valor) return alert("Digite um valor válido");

            const res = calcular(valor, n);
            
            document.getElementById('totalGeral').innerText = formatter.format(res.total);
            document.getElementById('detalheParcela').innerHTML = `<strong>${n}x</strong> de <strong>${formatter.format(res.parcela)}</strong>`;
            document.getElementById('resultadoUnico').classList.remove('is-hidden');
            document.getElementById('listaCompleta').classList.add('is-hidden');
            
            // Scroll suave para o resultado no mobile
            document.getElementById('resultadoUnico').scrollIntoView({ behavior: 'smooth' });
        });

        // Evento Mostrar Tudo
        btnMostrarTudo.addEventListener('click', () => {
            const valor = parseFloat(document.getElementById('valorInput').value);
            if (!valor) return alert("Digite um valor válido");

            const container = document.getElementById('containerLista');
            container.innerHTML = ""; // Limpa lista
            
            for (let i = 1; i <= 24; i++) {
                const res = calcular(valor, i);
                const item = document.createElement('div');
                item.className = "item-parcela";
                item.innerHTML = `
                    <div>
                        <span class="tag is-dark is-rounded mr-2">${i}x</span>
                        <span class="has-text-weight-bold">${formatter.format(res.parcela)}</span>
                    </div>
                    <div class="has-text-right">
                        <small class="is-block has-text-grey">Total: ${formatter.format(res.total)}</small>
                        <small class="is-size-7 has-text-link">${res.taxaPerc}% juros</small>
                    </div>
                `;
                container.appendChild(item);
            }

            document.getElementById('listaCompleta').classList.remove('is-hidden');
            document.getElementById('resultadoUnico').classList.add('is-hidden');
        });
    </script>
</body>
</html>
